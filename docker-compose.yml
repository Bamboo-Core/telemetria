# Stack de Telemetria — InfluxDB 3 Core + Explorer + Telegraf (Huawei + gNMI)
# Tudo em Docker. Suba com:  ./instalar.sh   (faz o bootstrap do token e do banco)
#
# Serviços:
#   influxdb3-core      — banco de séries temporais  (API em :8181)
#   influxdb3-explorer  — UI web                      (em :8888)
#   telegraf-huawei     — coleta passiva Huawei MDT   (escuta :57400 e :57600)
#   telegraf-gnmi       — coleta ativa gNMI (Juniper/Arista/Cisco) + métricas locais
#
# Opcional (perfil "nokia"): gnmic para dial-out Nokia. Suba com:
#   docker compose --profile nokia up -d

services:
  influxdb3-core:
    image: influxdb:3-core
    container_name: influxdb3-core
    user: "1000:1000"
    ports:
      - "8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - ./data:/var/lib/influxdb3/data
      - ./plugins:/var/lib/influxdb3/plugins
    restart: unless-stopped
    networks:
      - telemetria

  influxdb3-explorer:
    image: influxdata/influxdb3-ui:1.8.0
    container_name: influxdb3-explorer
    command: ["--mode=admin"]
    ports:
      - "8888:8080"
    volumes:
      - ./explorer/db:/db:rw
      - ./explorer/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET}
    restart: unless-stopped
    depends_on:
      - influxdb3-core
    networks:
      - telemetria

  # --- Coleta PASSIVA Huawei (dial-out gRPC MDT) -----------------------------
  # Imagem custom compilada com o plugin gRPC da Huawei (ver build/ e publicar.sh).
  # Os equipamentos Huawei EMPURRAM os dados para as portas abaixo.
  telegraf-huawei:
    image: ${HUAWEI_IMAGE:-ghcr.io/bamboo-core/telegraf-huawei:latest}
    container_name: telegraf-huawei
    network_mode: host
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_DB=${INFLUX_DB:-telemetria}
      - INFLUX_URL=${INFLUX_URL:-http://127.0.0.1:8181}
    volumes:
      - ./telegraf-huawei.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
    depends_on:
      - influxdb3-core

  # --- Coleta ATIVA gNMI (Juniper / Arista / Cisco) + métricas locais --------
  # A VM CONECTA em cada equipamento. Cadastre os devices em telegraf.d/ a partir
  # dos modelos em exemplos/ e preencha as credenciais no .env.
  telegraf-gnmi:
    image: telegraf:1.32
    container_name: telegraf-gnmi
    env_file: .env
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_DB=${INFLUX_DB:-telemetria}
      - INFLUX_URL=http://influxdb3-core:8181
    volumes:
      - ./telegraf-gnmi.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf.d:/etc/telegraf/telegraf.d:ro
    restart: unless-stopped
    depends_on:
      - influxdb3-core
    networks:
      - telemetria

  # --- OPCIONAL: Nokia dial-out via gnmic (perfil "nokia") -------------------
  gnmic-nokia:
    image: ghcr.io/openconfig/gnmic:latest
    container_name: gnmic-nokia
    profiles: ["nokia"]
    network_mode: host
    command: ["--config", "/app/gnmic.yaml", "subscribe"]
    volumes:
      - ./gnmic.yaml:/app/gnmic.yaml:ro
    restart: unless-stopped
    depends_on:
      - influxdb3-core

networks:
  telemetria:
    driver: bridge
