###############################################################################
# PROCESSORS — Huawei: converte node_id_str em tag host
###############################################################################
[[processors.converter]]
  [processors.converter.fields]
    tag = ["node_id_str"]

[[processors.rename]]
  order = 1
  [[processors.rename.replace]]
    tag = "node_id_str"
    dest = "host"
