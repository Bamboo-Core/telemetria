# Processors de limpeza de campos que colidem com tags no InfluxDB 3 (IOx).
# Mantido em telegraf.d/ para ser mesclado ao telegraf-gnmi.conf.

[[processors.starlark]]
  namepass = ["juniper_bgp_neighbor"]
  source = '''
def apply(metric):
    metric.fields.pop("neighbor_address", None)
    return metric
'''

[[processors.starlark]]
  namepass = ["juniper_components", "juniper_lacp", "juniper_comp_props"]
  source = '''
def apply(metric):
    metric.fields.pop("name", None)
    return metric
'''
