###############################################################################
# Telegraf — Coleta PASSIVA Huawei (dial-out gRPC MDT)
#
# Os equipamentos Huawei EMPURRAM os dados para a porta abaixo. Não há nada
# por-equipamento para cadastrar aqui: basta configurar o "telemetry" no Huawei
# apontando para <IP_DA_VM>:57400 (sensor-group + destination-group dial-out).
#
# Este container roda em network_mode: host, então fala com o InfluxDB pela
# porta publicada na própria VM (INFLUX_URL = http://127.0.0.1:8181).
###############################################################################

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  hostname = ""
  omit_hostname = true
  debug = false

###############################################################################
# OUTPUT — InfluxDB 3 Core
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = ""
  bucket = "${INFLUX_DB}"

###############################################################################
# INPUT — Huawei gRPC dial-out (porta 57400)
###############################################################################
[[inputs.huawei_telemetry_dialout]]
  service_address = ":57400"
  data_format = "json"
  transport = "grpc"

###############################################################################
# PROCESSORS — converte node_id_str em tag host
###############################################################################
[[processors.converter]]
  [processors.converter.fields]
    tag = ["node_id_str"]

[[processors.rename]]
  order = 1
  [[processors.rename.replace]]
    tag = "node_id_str"
    dest = "host"
