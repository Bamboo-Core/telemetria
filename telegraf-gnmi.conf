###############################################################################
# Telegraf — Coleta ATIVA gNMI (Juniper / Arista / Cisco) + métricas locais
#
# A VM CONECTA em cada equipamento (dial-in). Para CADASTRAR um equipamento:
#   1. Copie um modelo de  exemplos/  para  telegraf.d/   (ex.: arista-01.conf)
#   2. Edite IP, usuário e senha (use ${VARS} do .env ou preencha direto)
#   3. Reinicie:  docker compose restart telegraf-gnmi
#
# Tudo em telegraf.d/*.conf é mesclado a este arquivo automaticamente.
# Os PROCESSORS abaixo já tratam as colisões tag/field conhecidas do InfluxDB 3
# (IOx) — mantenha-os mesmo que ainda não tenha equipamentos cadastrados.
###############################################################################

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  hostname = "telegraf-gnmi"
  omit_hostname = false
  debug = false

###############################################################################
# OUTPUT — InfluxDB 3 Core
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = ""
  bucket = "${INFLUX_DB}"

###############################################################################
# INPUTS — métricas locais da VM (teste de pipeline)
# Servem para confirmar que o InfluxDB está recebendo dados, mesmo antes de
# cadastrar qualquer equipamento de rede.
###############################################################################
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  mount_points = ["/"]

[[inputs.system]]

###############################################################################
# PROCESSORS — tratamento genérico (aplicam-se a qualquer device gNMI)
###############################################################################

# Troca "/" por "_" nos nomes de campos das medições juniper_* (o construtor
# visual do Explorer não escapa "/").
[[processors.strings]]
  namepass = ["juniper_*"]
  [[processors.strings.replace]]
    field_key = "*"
    old = "/"
    new = "_"

# Converte "index" em tag na medição juniper_cpu.
[[processors.converter]]
  namepass = ["juniper_cpu"]
  [processors.converter.fields]
    tag = ["index"]

# Converte "id" em tag na medição juniper_alarms (evita colisão tag/field no IOx).
[[processors.converter]]
  namepass = ["juniper_alarms"]
  [processors.converter.fields]
    tag = ["id"]

# Carimba métricas do Arista com a hora de ingestão (oper/admin-status vêm com
# timestamp da última mudança; isto as torna visíveis em tempo real).
[[processors.starlark]]
  namepass = ["arista_*"]
  source = '''
load("time.star", "time")
def apply(metric):
    metric.time = time.now().unix_nano
    return metric
'''
